name: Build

on:
  workflow_dispatch:
    inputs:
      packages:
        description: 'Additional apt packages to install (space-separated)'
        required: false
        default: ''
  push:
    branches: ['main']
    paths:
      - ".github/workflows/build.yml"
      - "dockerfile"
      - "scripts/*"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu bases; each value is both the base tag and the published tag.
        # `latest` tracks Canonical's newest LTS.
        ubuntu: [latest, resolute, noble]
    steps:
      - name: Build and push
        uses: hieupth/gha-docker/build@1ab142fc109fc43357975bb0c14c567297747d7a # v0.1
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          image: ${{ vars.DOCKERHUB_USERNAME }}/mamba:${{ matrix.ubuntu }}
          platforms: linux/amd64,linux/arm64
          dockerfile: dockerfile
          build_args: |
            UBUNTU_VERSION=${{ matrix.ubuntu }}
            PACKAGES=${{ inputs.packages }}
